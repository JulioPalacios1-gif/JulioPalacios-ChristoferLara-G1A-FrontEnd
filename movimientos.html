<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
    <ul class="nav nav-pills">
        <li class="nav-item">
          <a class="nav-link" aria-current="page" href="index.html">Cuentas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="movimientos.html">Movimientos</a>
        </li>
      </ul>
      </nav>

          <section class = "card shadow-sm mb-4">
      <div class="card-header bg-success text-white">
        <h2 class="h5 mb-0">Registro de Movimientos</h2>
      </div>
      <div class="card-body">
        <form id="movimientoForm">
          <input type="hidden" id="IdMovimiento">
          <div class="form-group my-3 col-md-6">
            <label for="selCuenta" class="form-label">Cuentas</label>
            <select class="form-select" id="selCuenta" required>
              <option value="">Seleccione una cuenta</option>
              <!-- Opciones de cuentas cargaadas desde el controller -->
            </select>
          </div>
          <div class="mb-3">
            <label for="txtFecha" class="form-label">Fecha</label>
            <input type="date" class="form-control" id="txtFecha" required>
          </div>
          <div class="mb-3">
            <label for="txtTipoMov" class="form-label">tipo</label>
            <input type="text" class="form-control" id="txtTipoMov" required>
          </div>
          <div class="mb-3">
            <label for="txtCategoria" class="form-label">Categoria</label>
            <input type="text" class="form-control" id="txtCategoria" required>
          </div>
          <div class="mb-3">
            <label for="txtDescripcion" class="form-label">Descripcion</label>
            <input type="text" class="form-control" id="txtDescripcion" required>
          </div>
          <div class="mb-3">
            <label for="txtMonto" class="form-label">Monto</label>
            <input type="number" class="form-control" id="txtMonto" required>
          </div>
          <div class="form-group my-3">
            <button type="submit" class="btn btn-success">Guardar</button>
            <button type="button" class="btn btn-secondary" id="btnCancelar">Cancelar</button>
          </div>
        </form>
    </section>

    <section class="card shadow-sm">
      <div class="card-header bg-success text-white">
        <h2 class="h5 mb-0">Listado de Movimientos</h2>
      </div>
      <div class="card-body">
        <table class="table table-striped" id="movimientosTable">
          <thead>
            <tr>
              <th>IdMovimiento</th>
              <th>Cuenta</th>
              <th>Fecha</th>
              <th>Tipo</th>
              <th>Categoria</th>
              <th>Descripcion</th>
              <th>Acciones</th>
              <th>Monto</th>
            </tr>
          </thead>
          <tbody id="movimientosTableBody">
            <!-- Filas de cuentas cargadas desde el controller -->
          </tbody>
        </table>
      </div>

    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script type="module" src="js/controllers/movimientosController.js"></script>
</body>
</html>
