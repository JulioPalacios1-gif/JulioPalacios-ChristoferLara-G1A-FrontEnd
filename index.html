<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuentas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
    <ul class="nav nav-pills">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="index.html">Cuentas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="movimientos.html">Movimientos</a>
        </li>
      </ul>
    </nav>
    
    <section class = "card shadow-sm mb-4">
      <div class="card-header bg-success text-white">
        <h2 class="h5 mb-0">Registro de Cuentas</h2>
      </div>
      <div class="card-body">
        <form id="cuentaForm">
          <input type="hidden" id="IdCuenta">
          <div class="form-group my-3 col-md-6">
            <label for="selUsuario" class="form-label">Usuarios</label>
            <select class="form-select" id="selUsuario" required>
              <option value="">Seleccione un usuario</option>
              <!-- Opciones de usuarios cargaadas desde el controller -->
            </select>
          </div>
          <div class="mb-3">
            <label for="txtNombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="txtNombre" required>
          </div>
          <div class="mb-3">
            <label for="txtTipo" class="form-label">tipo</label>
            <input type="text" class="form-control" id="txtTipo" required>
          </div>
          <div class="mb-3">
            <label for="txtSaldo" class="form-label">Saldo</label>
            <input type="number" class="form-control" id="txtSaldo" min="0.01" step="0.01" required>
          </div>
          <div class="form-group my-3 col-md-6">
            <label for="selActivo" class="form-label">Activo</label>
            <select class="form-select" id="selActivo" required>
              <option value="">Seleccione una opción</option>
              <option value="S">Sí</option>
              <option value="N">No</option>
            </select>
          </div>
          <div class="form-group my-3">
            <button type="submit" class="btn btn-success" id="btnGuardar">Guardar</button>
            <button type="button" class="btn btn-secondary" id="btnCancelar">Cancelar</button>
          </div>
        </form>
    </section>

    <section class="card shadow-sm">
      <div class="card-header bg-success text-white">
        <h2 class="h5 mb-0">Listado de Cuentas</h2>
      </div>
      <div class="card-body">
        <table class="table table-striped" id="cuentasTable">
          <thead>
            <tr>
              <th>IdCuenta</th>
              <th>Usuario</th>
              <th>Nombre</th>
              <th>Tipo</th>
              <th>Saldo</th>
              <th>Activo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="cuentasTableBody">
            <!-- Filas de cuentas cargadas desde el controller -->
          </tbody>
        </table>
      </div>





    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script type="module" src="js/controllers/indexController.js"></script>
</body>
</html>
